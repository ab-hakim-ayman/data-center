frr version 8.4_git
frr defaults traditional
hostname leaf1
no ipv6 forwarding
service integrated-vtysh-config
!
password zebra
enable password zebra
!
interface eth1
 description Link to spine1
 ip address 10.0.11.2/30
exit
!
interface eth2
 description Link to spine2
 ip address 10.0.21.2/30
exit
!
interface lo
 ip address 10.255.0.11/32
exit
!
router bgp 65011
 bgp router-id 10.255.0.11
 no bgp ebgp-requires-policy
 neighbor 10.0.11.1 remote-as 65001
 neighbor 10.0.11.1 description spine1
 neighbor 10.0.21.1 remote-as 65002
 neighbor 10.0.21.1 description spine2
 !
 address-family ipv4 unicast
  network 10.255.0.11/32
  network 192.168.10.0/24
 exit-address-family
exit
!
