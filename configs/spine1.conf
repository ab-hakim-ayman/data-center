frr version 8.4_git
frr defaults traditional
hostname spine1
no ipv6 forwarding
service integrated-vtysh-config
!
password zebra
enable password zebra
!
interface eth1
 description Link to leaf1 (Primary Core Uplink)
 ip address 10.0.11.1/30
exit
!
interface eth2
 description Link to leaf2
 ip address 10.0.12.1/30
exit
!
interface lo
 ip address 10.255.0.1/32
exit
!
router bgp 65001
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.11.2 remote-as 65011
 neighbor 10.0.11.2 description leaf1
 neighbor 10.0.12.2 remote-as 65012
 neighbor 10.0.12.2 description leaf2
 !
 address-family ipv4 unicast
  network 10.0.11.0/30
  network 10.0.12.0/30
  network 10.255.0.1/32
 exit-address-family
exit
!
