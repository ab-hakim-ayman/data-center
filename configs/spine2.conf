frr version 8.4_git
frr defaults traditional
hostname spine2
no ipv6 forwarding
service integrated-vtysh-config
!
password zebra
enable password zebra
!
interface eth1
 description Link to leaf1
 ip address 10.0.21.1/30
exit
!
interface eth2
 description Link to leaf2
 ip address 10.0.22.1/30
exit
!
interface lo
 ip address 10.255.0.2/32
exit
!
router bgp 65002
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.21.2 remote-as 65011
 neighbor 10.0.21.2 description leaf1
 neighbor 10.0.22.2 remote-as 65012
 neighbor 10.0.22.2 description leaf2
 !
 address-family ipv4 unicast
  network 10.0.21.0/30
  network 10.0.22.0/30
  network 10.255.0.2/32
 exit-address-family
exit
!
